{% extends 'base.html' %}

{% block title %}{{ accion }} Producto{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <div class="flex items-center gap-3">
        <a href="{% url 'inventario:productos_lista' %}" class="p-2.5 rounded-xl bg-[#162034] text-slate-400 hover:text-white transition">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="font-display font-extrabold text-2xl text-white">{{ accion }} Producto / Servicio</h1>
            <p class="text-xs text-slate-400">Precios de venta, costo de compra y parámetros de inventario</p>
        </div>
    </div>

    <form method="POST" enctype="multipart/form-data" class="bg-[#111827] border border-[#1e2d47] rounded-3xl p-6 sm:p-8 space-y-5 shadow-xl">
        {% csrf_token %}

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Código / SKU *</label>
                <input type="text" name="codigo" value="{{ producto.codigo|default:'' }}" required placeholder="Ej: PROD-101"
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500 uppercase font-mono">
            </div>

            <div class="sm:col-span-2">
                <label class="block font-semibold text-slate-300 mb-1">Nombre del Producto / Servicio *</label>
                <input type="text" name="nombre" value="{{ producto.nombre|default:'' }}" required placeholder="Ej: Memoria RAM DDR5 16GB Kingston"
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500 font-bold">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Categoría</label>
                <select name="categoria" class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    <option value="">-- Sin categoría --</option>
                    {% for c in categorias %}
                    <option value="{{ c.id }}" {% if producto and producto.categoria_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Unidad de Medida</label>
                <select name="unidad_medida" class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    {% for u in unidades %}
                    <option value="{{ u.id }}" {% if producto and producto.unidad_medida_id == u.id %}selected{% endif %}>{{ u.nombre }} ({{ u.codigo }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Precio de Venta ($ COP) *</label>
                <input type="number" step="0.01" name="precio_venta" value="{{ producto.precio_venta|default:'0' }}" required
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500 font-bold">
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Costo de Compra ($ COP)</label>
                <input type="number" step="0.01" name="costo_unitario" value="{{ producto.costo_unitario|default:'0' }}"
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Tarifa de IVA (%)</label>
                <select name="tarifa_iva" class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    <option value="19" {% if not producto or producto.tarifa_iva == 19 %}selected{% endif %}>19% (General)</option>
                    <option value="5" {% if producto and producto.tarifa_iva == 5 %}selected{% endif %}>5% (Reducido)</option>
                    <option value="0" {% if producto and producto.tarifa_iva == 0 %}selected{% endif %}>0% (Exento / Excluido)</option>
                </select>
            </div>
        </div>

        <div class="p-4 rounded-2xl bg-[#162034] border border-[#1e2d47] space-y-3">
            <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-sky-400">
                <input type="checkbox" name="maneja_inventario" {% if not producto or producto.maneja_inventario %}checked{% endif %} class="rounded text-sky-600 focus:ring-0">
                <span>¿Controlar Existencias / Stock de este Producto?</span>
            </label>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs pt-1">
                {% if not producto %}
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Stock Inicial de Entrada</label>
                    <input type="number" step="0.01" name="stock_actual" value="0"
                           class="w-full bg-[#111827] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                {% endif %}
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Stock Mínimo (Alerta de Reorden)</label>
                    <input type="number" step="0.01" name="stock_minimo" value="{{ producto.stock_minimo|default:'5' }}"
                           class="w-full bg-[#111827] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>
        </div>

        <div class="text-xs">
            <label class="block font-semibold text-slate-300 mb-1">Descripción Detallada</label>
            <textarea name="descripcion" rows="2" placeholder="Especificaciones técnicas, notas para factura..."
                      class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">{{ producto.descripcion|default:'' }}</textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#1e2d47]">
            <a href="{% url 'inventario:productos_lista' %}" class="px-4 py-2 rounded-xl bg-[#162034] text-slate-300 hover:text-white text-xs font-bold transition">
                Cancelar
            </a>
            <button type="submit"
                    class="px-5 py-2 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-black text-xs uppercase tracking-wider shadow-lg shadow-sky-500/20 transition">
                Guardar Producto
            </button>
        </div>
    </form>

</div>
{% endblock %}
