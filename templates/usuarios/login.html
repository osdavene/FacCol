{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — FacCol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#090d16] text-slate-200 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Fondo de gradientes dinámicos -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md bg-[#111827] border border-[#1e2d47] rounded-3xl p-8 shadow-2xl relative z-10">
        
        <!-- Brand / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-400 text-black font-black text-2xl shadow-xl shadow-amber-500/20 mb-4">
                FC
            </div>
            <h1 class="font-display font-extrabold text-2xl text-white tracking-tight">
                Fac<span class="text-amber-500">Col</span>
            </h1>
            <p class="text-xs text-slate-400 mt-1">
                Facturación Electrónica & ERP Multi-Empresa Colombia 🇨🇴
            </p>
        </div>

        <!-- Mensajes de Error / Info -->
        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
            <div class="p-3 rounded-xl border text-xs font-medium {% if message.tags == 'error' %}bg-red-500/10 border-red-500/30 text-red-300{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-300{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Formulario -->
        <form method="POST" action="{% url 'usuarios:login' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Correo Electrónico o Usuario</label>
                <div class="relative">
                    <input type="text" name="login" required autofocus
                           value="admin@faccol.com"
                           placeholder="ejemplo@empresa.com"
                           class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                    <i class="fas fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Contraseña</label>
                <div class="relative">
                    <input type="password" name="password" required
                           value="admin123"
                           placeholder="••••••••"
                           class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                    <i class="fas fa-lock absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center gap-2 cursor-pointer text-slate-400">
                    <input type="checkbox" name="remember" checked class="rounded border-[#1e2d47] text-amber-500 focus:ring-0">
                    <span>Recordar sesión</span>
                </label>
                <span class="text-amber-500 hover:text-amber-400 text-[11px] cursor-pointer">¿Olvidó contraseña?</span>
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-extrabold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-amber-500/20 transition duration-150 transform active:scale-[0.98]">
                Iniciar Sesión
            </button>
        </form>

        <!-- Tarjeta de Acceso Rápido / Demo -->
        <div class="mt-8 p-3 rounded-2xl bg-[#162034]/60 border border-[#1e2d47] text-[11px] text-slate-400 text-center">
            <span class="text-amber-400 font-bold">Credenciales Demo:</span> <code>admin@faccol.com</code> / <code>admin123</code>
        </div>

    </div>

</body>
</html>
