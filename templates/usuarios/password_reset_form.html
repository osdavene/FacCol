{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña — FacCol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0b0f1a;
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .fc-auth-card {
            max-width: 28rem;
            width: 100%;
            background-color: #111827;
            border: 1px solid #1e2d47;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .fc-auth-input {
            width: 100%;
            background-color: #0b0f1a;
            border: 1px solid #1e2d47;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            color: #ffffff;
            outline: none;
        }
        .fc-auth-input:focus { border-color: #f59e0b; }
        .fc-auth-btn {
            width: 100%;
            padding: 0.85rem 1rem;
            border: none;
            border-radius: 0.75rem;
            background-color: #f59e0b;
            color: #0b0f1a;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
        }
        .fc-auth-btn:hover { background-color: #fbbf24; }
        a { text-decoration: none; }
    </style>
</head>
<body class="bg-[#0b0f1a] text-slate-200 min-h-screen flex items-center justify-center p-4">
    <div class="fc-auth-card max-w-md w-full bg-[#111827] border border-[#1e2d47] rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-amber-500/15 border border-amber-500/30 text-amber-400 flex items-center justify-center mx-auto text-xl">
                <i class="fas fa-key"></i>
            </div>
            <h1 class="font-bold text-xl text-white">Recuperar Contraseña</h1>
            <p class="text-xs text-slate-400">Ingresa el correo registrado en tu cuenta para enviarte un enlace seguro de recuperación.</p>
        </div>

        {% if messages %}
        <div class="space-y-2">
            {% for m in messages %}
            <div class="p-3 rounded-xl text-xs bg-amber-500/10 border border-amber-500/30 text-amber-300">{{ m }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Correo Electrónico</label>
                <input type="email" name="email" required autofocus placeholder="usuario@empresa.com"
                       class="fc-auth-input w-full bg-[#0b0f1a] border border-[#1e2d47] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-amber-500">
            </div>
            <button type="submit"
                    class="fc-auth-btn w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs uppercase tracking-wider transition">
                Enviar Enlace de Recuperación
            </button>
        </form>

        <div class="text-center">
            <a href="{% url 'usuarios:login' %}" class="text-xs text-slate-400 hover:text-amber-400">
                <i class="fas fa-arrow-left mr-1"></i> Volver al inicio de sesión
            </a>
        </div>
    </div>
</body>
</html>
