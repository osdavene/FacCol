{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación 2FA — FacCol</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f1a] text-slate-200 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-[#111827] border border-[#1e2d47] rounded-3xl p-8 shadow-2xl space-y-5">
        <div>
            <div class="text-xs font-bold uppercase tracking-wider text-amber-400">Seguridad 2FA</div>
            <h1 class="text-2xl font-black text-white mt-1">Verifica tu identidad</h1>
            <p class="text-xs text-slate-400 mt-1">Ingresa el código de 6 dígitos de tu app autenticadora para <strong>{{ usuario_email }}</strong>.</p>
        </div>

        {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
            <div class="p-3 rounded-xl border text-xs font-semibold {% if message.tags == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-300{% else %}bg-amber-500/10 border-amber-500/30 text-amber-300{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Código TOTP (6 dígitos)</label>
                <input type="text" name="codigo" maxlength="6" autofocus required autocomplete="one-time-code"
                       placeholder="000000"
                       class="w-full bg-[#0f172a] border border-[#1e2d47] rounded-xl px-4 py-3 text-center text-xl tracking-[0.4em] font-mono text-white focus:border-amber-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-black text-xs uppercase tracking-wider">
                Verificar e Ingresar
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="{% url 'usuarios:login' %}" class="text-xs text-slate-400 hover:text-white">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
