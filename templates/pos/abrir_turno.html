{% extends 'base.html' %}

{% block title %}Abrir Turno de Caja{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">
    <div class="text-center">
        <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-500 flex items-center justify-center text-xl mx-auto mb-2">
            <i class="fas fa-cash-register"></i>
        </div>
        <h1 class="font-display font-extrabold text-2xl text-white">Apertura de Caja (POS)</h1>
        <p class="text-xs text-slate-400">Ingrese la base en efectivo disponible para inicio de operaciones</p>
    </div>

    <form method="POST" class="bg-[#111827] border border-[#1e2d47] rounded-3xl p-6 sm:p-8 space-y-4 shadow-xl">
        {% csrf_token %}

        <div class="text-xs">
            <label class="block font-semibold text-slate-300 mb-1">Caja Registradora *</label>
            <select name="caja" required class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                {% for c in cajas %}
                <option value="{{ c.id }}">{{ c.nombre }} ({{ c.codigo }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="text-xs">
            <label class="block font-semibold text-slate-300 mb-1">Base Inicial en Efectivo ($ COP) *</label>
            <input type="number" step="0.01" name="monto_inicial" value="100000" required placeholder="Ej: 100000"
                   class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-amber-500 font-bold text-sm">
            <span class="text-[10px] text-slate-500 mt-1 block">Monto en billetes y monedas para cambio en caja.</span>
        </div>

        <button type="submit"
                class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-black text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-amber-500/20 transition">
            Abrir Turno e Ingresar al POS
        </button>
    </form>
</div>
{% endblock %}
