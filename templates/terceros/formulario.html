{% extends 'base.html' %}

{% block title %}{{ accion }} Tercero{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <div class="flex items-center gap-3">
        <a href="{% url 'terceros:lista' %}" class="p-2.5 rounded-xl bg-[#162034] text-slate-400 hover:text-white transition">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="font-display font-extrabold text-2xl text-white">{{ accion }} Tercero</h1>
            <p class="text-xs text-slate-400">Datos fiscales y de contacto para facturación y retenciones</p>
        </div>
    </div>

    <form method="POST" class="bg-[#111827] border border-[#1e2d47] rounded-3xl p-6 sm:p-8 space-y-5 shadow-xl">
        {% csrf_token %}

        <div class="flex items-center gap-6 p-4 rounded-2xl bg-[#162034] border border-[#1e2d47] text-xs font-bold">
            <label class="flex items-center gap-2 cursor-pointer text-purple-400">
                <input type="checkbox" name="es_cliente" {% if not tercero or tercero.es_cliente %}checked{% endif %} class="rounded text-purple-600 focus:ring-0">
                <span>Es Cliente</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-sky-400">
                <input type="checkbox" name="es_proveedor" {% if tercero and tercero.es_proveedor %}checked{% endif %} class="rounded text-sky-600 focus:ring-0">
                <span>Es Proveedor</span>
            </label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Tipo de Persona *</label>
                <select name="tipo_persona" class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    <option value="NATURAL" {% if tercero and tercero.tipo_persona == 'NATURAL' %}selected{% endif %}>Persona Natural</option>
                    <option value="JURIDICA" {% if tercero and tercero.tipo_persona == 'JURIDICA' %}selected{% endif %}>Persona Jurídica</option>
                </select>
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Tipo de Documento *</label>
                <select name="tipo_documento" class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    <option value="CC" {% if tercero and tercero.tipo_documento == 'CC' %}selected{% endif %}>Cédula de Ciudadanía (CC)</option>
                    <option value="NIT" {% if tercero and tercero.tipo_documento == 'NIT' %}selected{% endif %}>NIT (Empresas)</option>
                    <option value="CE" {% if tercero and tercero.tipo_documento == 'CE' %}selected{% endif %}>Cédula de Extranjería (CE)</option>
                    <option value="PASAPORTE" {% if tercero and tercero.tipo_documento == 'PASAPORTE' %}selected{% endif %}>Pasaporte</option>
                </select>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div class="col-span-2">
                    <label class="block font-semibold text-slate-300 mb-1">No. Documento *</label>
                    <input type="text" name="numero_documento" value="{{ tercero.numero_documento|default:'' }}" required placeholder="Ej: 900876543"
                           class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">DV</label>
                    <input type="text" name="dv" maxlength="1" value="{{ tercero.dv|default:'' }}" placeholder="1"
                           class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-2 py-2 text-center text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Razón Social / Nombre Completo *</label>
                <input type="text" name="razon_social" value="{{ tercero.razon_social|default:'' }}" required placeholder="Ej: Distribuciones del Norte S.A.S."
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Nombre Comercial (Opcional)</label>
                <input type="text" name="nombre_comercial" value="{{ tercero.nombre_comercial|default:'' }}" placeholder="Ej: DistriNorte"
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Correo Electrónico (Facturación)</label>
                <input type="email" name="email" value="{{ tercero.email|default:'' }}" placeholder="facturas@cliente.com"
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Teléfono / Móvil</label>
                <input type="text" name="telefono" value="{{ tercero.telefono|default:'' }}" placeholder="300 123 4567"
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Dirección</label>
                <input type="text" name="direccion" value="{{ tercero.direccion|default:'' }}" placeholder="Calle 100 # 15 - 20"
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Régimen Tributario</label>
                <select name="regimen" class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    <option value="RESPONSABLE_IVA">Responsable de IVA (Común)</option>
                    <option value="NO_RESPONSABLE_IVA">No Responsable de IVA (Simplificado)</option>
                    <option value="REGIMEN_SIMPLE">Régimen Simple (RST)</option>
                    <option value="GRAN_CONTRIBUYENTE">Gran Contribuyente</option>
                </select>
            </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#1e2d47]">
            <a href="{% url 'terceros:lista' %}" class="px-4 py-2 rounded-xl bg-[#162034] text-slate-300 hover:text-white text-xs font-bold transition">
                Cancelar
            </a>
            <button type="submit"
                    class="px-5 py-2 rounded-xl bg-gradient-to-r from-purple-600 to-amber-500 hover:from-purple-500 hover:to-amber-400 text-white font-black text-xs uppercase tracking-wider shadow-lg shadow-purple-600/20 transition">
                Guardar Tercero
            </button>
        </div>
    </form>

</div>
{% endblock %}
