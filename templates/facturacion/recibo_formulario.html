{% extends 'base.html' %}

{% block title %}Registrar Recibo de Caja{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

    <div class="flex items-center gap-3">
        <a href="{% url 'facturacion:recibos_lista' %}" class="p-2.5 rounded-xl bg-[#162034] text-slate-400 hover:text-white transition">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="font-display font-extrabold text-2xl text-white">Registrar Cobro / Recibo</h1>
            <p class="text-xs text-slate-400">Ingreso de dinero para abono a factura o anticipo</p>
        </div>
    </div>

    <form method="POST" action="{% url 'facturacion:recibo_crear' %}" class="bg-[#111827] border border-[#1e2d47] rounded-3xl p-6 sm:p-8 space-y-4 shadow-xl">
        {% csrf_token %}

        <!-- Factura a la que abona -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Factura a Abonar (Opcional)</label>
            <select name="factura" class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                <option value="">-- Sin factura asociada / Anticipo directo --</option>
                {% for f in facturas_pendientes %}
                <option value="{{ f.id }}" {% if factura_sel and factura_sel.id == f.id %}selected{% endif %}>
                    {{ f.numero_completo }} — {{ f.tercero.razon_social }} (Saldo: ${{ f.saldo_pendiente|floatformat:0 }})
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Cliente / Tercero -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Cliente / Tercero Pagador *</label>
            <select name="tercero" required class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                {% for c in terceros %}
                <option value="{{ c.id }}" {% if factura_sel and factura_sel.tercero_id == c.id %}selected{% endif %}>
                    {{ c.razon_social }} ({{ c.documento_completo }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Valor Recibido ($ COP) *</label>
                <input type="number" step="0.01" name="valor" required
                       value="{% if factura_sel %}{{ factura_sel.saldo_pendiente }}{% endif %}"
                       placeholder="Ej: 500000"
                       class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500 font-bold">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Método de Pago</label>
                <select name="metodo_pago" class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                    <option value="EFECTIVO">Efectivo</option>
                    <option value="TRANSFERENCIA">Transferencia Bancaria (Bancolombia, Nequi)</option>
                    <option value="TARJETA">Datáfono / Tarjeta</option>
                    <option value="WOMPI">Pasarela Wompi</option>
                    <option value="CHEQUE">Cheque</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">No. Comprobante / Referencia Bancaria</label>
            <input type="text" name="referencia_pago" placeholder="Ej: TR-8947234 o Cód Aprobación"
                   class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Observaciones</label>
            <textarea name="observaciones" rows="2" placeholder="Notas sobre el pago o concepto..."
                      class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#1e2d47]">
            <a href="{% url 'facturacion:recibos_lista' %}" class="px-4 py-2 rounded-xl bg-[#162034] text-slate-300 hover:text-white text-xs font-bold transition">
                Cancelar
            </a>
            <button type="submit"
                    class="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-black font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 transition">
                Guardar Recibo
            </button>
        </div>
    </form>

</div>
{% endblock %}
