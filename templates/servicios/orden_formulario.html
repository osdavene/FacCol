{% extends 'base.html' %}

{% block title %}Nueva Orden de Servicio{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center gap-3">
        <a href="{% url 'servicios:ordenes_lista' %}" class="p-2.5 rounded-xl bg-[#162034] text-slate-400 hover:text-white transition">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="font-display font-extrabold text-2xl text-white">Nueva Orden de Servicio Técnico</h1>
            <p class="text-xs text-slate-400">Recepción de dispositivo para revisión, mantenimiento o reparación</p>
        </div>
    </div>

    <form method="POST" class="bg-[#111827] border border-[#1e2d47] rounded-3xl p-6 sm:p-8 space-y-5 shadow-xl text-xs">
        {% csrf_token %}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Cliente *</label>
                <select name="cliente" required class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    <option value="">-- Seleccionar cliente --</option>
                    {% for c in clientes %}
                    <option value="{{ c.id }}">{{ c.razon_social }} ({{ c.documento_completo }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Prioridad</label>
                <select name="prioridad" class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    <option value="NORMAL">Normal</option>
                    <option value="ALTA">Alta / Urgente</option>
                    <option value="BAJA">Baja</option>
                </select>
            </div>
        </div>

        <!-- Datos del Dispositivo -->
        <div class="p-4 rounded-2xl bg-[#162034] border border-[#1e2d47] space-y-3">
            <div class="font-bold text-amber-400 text-xs uppercase tracking-wider">Datos del Dispositivo / Equipo</div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-slate-400 mb-1">Tipo de Equipo</label>
                    <input type="text" name="tipo_equipo" placeholder="Ej: Laptop / Smartphone" class="w-full bg-[#111827] border border-[#1e2d47] rounded-xl px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Marca</label>
                    <input type="text" name="marca" placeholder="Ej: Lenovo / Apple" class="w-full bg-[#111827] border border-[#1e2d47] rounded-xl px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Modelo / Serial</label>
                    <input type="text" name="modelo" placeholder="Ej: ThinkPad T14" class="w-full bg-[#111827] border border-[#1e2d47] rounded-xl px-3 py-2 text-white">
                </div>
            </div>
            <div>
                <label class="block text-slate-400 mb-1">Accesorios Dejados</label>
                <input type="text" name="accesorios" placeholder="Ej: Cargador original, estuche, cable de poder..." class="w-full bg-[#111827] border border-[#1e2d47] rounded-xl px-3 py-2 text-white">
            </div>
        </div>

        <div>
            <label class="block font-semibold text-slate-300 mb-1">Falla Reportada por el Cliente *</label>
            <textarea name="falla_reportada" rows="3" required placeholder="Describe los síntomas y el problema reportado..."
                      class="w-full bg-[#162034] border border-[#1e2d47] rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#1e2d47]">
            <a href="{% url 'servicios:ordenes_lista' %}" class="px-4 py-2 rounded-xl bg-[#162034] text-slate-300 hover:text-white font-bold transition">Cancelar</a>
            <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-black uppercase tracking-wider transition">
                Crear Orden de Servicio
            </button>
        </div>
    </form>
</div>
{% endblock %}
