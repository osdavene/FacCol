name: 🚀 Despliegue Automático a AWS (FacCol Python)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Desplegar FacCol Python en Servidor AWS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Ejecutar Despliegue en AWS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Iniciando despliegue de FacCol (Python Django) en AWS..."
            SITE_DIR="/home/faccol/htdocs/faccol.com"
            SITE_USER="faccol"

            sudo git config --global --add safe.directory "$SITE_DIR"

            sudo -u "$SITE_USER" bash << 'EOF'
            set -e
            cd "/home/faccol/htdocs/faccol.com"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            venv/bin/pip install --upgrade pip
            venv/bin/pip install -r requirements.txt
            venv/bin/python manage.py migrate --noinput
            venv/bin/python manage.py seed_base
            venv/bin/python manage.py seed_colombia
            venv/bin/python manage.py crear_empresa_pruebas --notificar-superadmin
            venv/bin/python manage.py collectstatic --noinput

            mkdir -p logs
            (crontab -l 2>/dev/null | grep -v "# faccol-cron" || true; \
              echo "*/20 * * * * cd /home/faccol/htdocs/faccol.com && venv/bin/python manage.py procesar_cola_dian >> logs/cron_dian.log 2>&1 # faccol-cron"; \
              echo "30 12 * * * cd /home/faccol/htdocs/faccol.com && venv/bin/python manage.py verificar_vencimientos_plan >> logs/cron_vencimientos.log 2>&1 # faccol-cron"; \
              echo "30 5 * * * cd /home/faccol/htdocs/faccol.com && venv/bin/python manage.py respaldar_bd >> logs/cron_backup.log 2>&1 # faccol-cron"; \
              echo "15 6 * * * cd /home/faccol/htdocs/faccol.com && venv/bin/python manage.py procesar_facturas_recurrentes >> logs/cron_recurrentes.log 2>&1 # faccol-cron"; \
              echo "5 0 * * * cd /home/faccol/htdocs/faccol.com && venv/bin/python manage.py enviar_resumen_diario >> logs/cron_resumen.log 2>&1 # faccol-cron") | crontab -
            EOF

            sudo systemctl restart faccol.service
            echo "✅ ¡Despliegue de FacCol Python completado con éxito en AWS!"
