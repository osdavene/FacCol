name: 🚀 Despliegue Automático a AWS (FacCol Python)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Desplegar FacCol Python en Servidor AWS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Ejecutar Despliegue en AWS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Iniciando despliegue de FacCol (Python Django) en AWS..."
            SITE_DIR="/home/faccol/htdocs/faccol.com"
            SITE_USER="faccol"

            sudo git config --global --add safe.directory "$SITE_DIR"

            sudo -u "$SITE_USER" bash << 'EOF'
            set -e
            cd "/home/faccol/htdocs/faccol.com"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            venv/bin/pip install --upgrade pip
            venv/bin/pip install -r requirements.txt
            venv/bin/python manage.py migrate --noinput
            venv/bin/python manage.py seed_base
            venv/bin/python manage.py seed_colombia
            venv/bin/python manage.py collectstatic --noinput

            # Sincronizar credenciales activas de Amazon SES en .env
            venv/bin/python -c "
with open('.env', 'r') as f:
    lines = f.readlines()
new_lines = []
for line in lines:
    if line.startswith('EMAIL_HOST_USER='):
        new_lines.append('EMAIL_HOST_USER=AKIATXQS4XBASZCLAIOE\n')
    elif line.startswith('EMAIL_HOST_PASSWORD='):
        new_lines.append('EMAIL_HOST_PASSWORD=BJM51yyYIRU+l7ptJfR4FmfoRqkSeu9URlQ9owqYGBZE\n')
    elif line.startswith('DEFAULT_FROM_EMAIL='):
        new_lines.append('DEFAULT_FROM_EMAIL=notificaciones@servigest.online\n')
    else:
        new_lines.append(line)
with open('.env', 'w') as f:
    f.writelines(new_lines)
"
            EOF

            sudo systemctl restart faccol.service
            echo "✅ ¡Despliegue de FacCol Python completado con éxito en AWS!"
